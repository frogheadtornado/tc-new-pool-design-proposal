# Defaults for all profiles.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
cache = true
cache_path = "cache"
force = false
# Per-file pragma + compilation_restrictions select solc (0.5.11 classic, 0.8.x tests).
auto_detect_solc = true
# Default EVM for forge-std tests (needs chainid / Istanbul+).
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 3
isolate = true
lint = { lint_on_build = false }
# Link Hasher library like the live 1/10/100 ETH pools.
libraries = [
  "src/classic/TornadoCash_eth.sol:Hasher:0x83584f83f26aF4eDDA9CBe8C730bc87C364b28fe",
]

# Classic pools: match mainnet TornadoCash_eth (petersburg + solc 0.5.11).
[[profile.default.additional_compiler_profiles]]
name = "classic"
evm_version = "petersburg"
optimizer = true
optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/{AddEthPoolsProposal.sol,FeeEnforcedTornado_eth.sol,classic/**,interfaces/**}"
version = "=0.5.11"
evm_version = "petersburg"
optimizer_runs = 200

# Staking implementation, and the proposal that deploys it (a later vote): match the live
# TornadoStakingRewards (istanbul + solc 0.6.12).
[[profile.default.additional_compiler_profiles]]
name = "staking"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/staking/**"
version = "=0.6.12"
evm_version = "istanbul"
optimizer_runs = 200

# Default overrides for the CI runs.
[profile.ci]
force = true
verbosity = 4

# Keep the formatter away from verified sources: the classic mixer and the staking dependencies are
# byte-identical to Sourcify, and the staking contract is the verified source plus marked additions.
[fmt]
ignore = ["src/classic/*.sol", "src/staking/**/*.sol"]

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
